# TEMPORARY: contributor.info is paused. This config serves a static notice page
# and 302-redirects every URL to it at /paused/. No build command runs, and the functions and
# edge functions directories are pointed at paths that don't exist so nothing
# is bundled or deployed alongside the page.
#
# To resume: `git mv netlify.active.toml netlify.toml`, delete maintenance/, and redeploy.

[build]
  publish = "maintenance"
  edge_functions = "maintenance/no-edge-functions"

[functions]
  directory = "maintenance/no-functions"

[build.processing]
  skip_processing = true
