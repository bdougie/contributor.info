# Fly.io configuration for the chart screenshot service (headless Chromium).
#
# Scale-to-zero (cost-reduction plan, Phase 1b): no machine runs between
# requests. Fly's proxy starts a machine on the first request (~3-5 s cold,
# including the Chromium launch) and stops it again after a few idle minutes.
# OG social cards already render in the Netlify `social-cards` function behind
# CDN caching; this app only serves `/charts/*` and the legacy og:image
# redirects. Repeat chart renders are served from the Supabase Storage cache
# by the app itself, so they still wake a machine; see docs/social-cards.md.
#
# Rules: never set min_machines_running > 0 or auto_stop_machines = false here.
app = "contributor-info-social-cards"
primary_region = "sjc"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[experimental]
  auto_rollback = true

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  # One health check is enough; the old tcp + http pair kept the machine
  # "busy" from the proxy's point of view. grace_period covers Chromium startup.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[metrics]
  port = 9091
  path = "/metrics"

[deploy]
  strategy = "rolling"

# VM configuration for Playwright
[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
