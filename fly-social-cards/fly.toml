# Fly.io configuration for the chart screenshot service (headless Chromium).
#
# Scale-to-zero (cost-reduction plan, Phase 1b): no machine runs between
# requests. Measured 2026-10-19: a stopped machine takes ~17 s to serve its
# first chart (boot + Chromium launch + render), far past a crawler's 2-5 s
# budget, so crawlers must not depend on waking this app:
#
#   - Rendered charts are written to the public Supabase Storage bucket
#     `chart-screenshots` at a deterministic path, and the social-meta edge
#     function on contributor.info points crawlers at that object directly.
#     Only a cache miss reaches this app (see docs/social-cards.md).
#   - `auto_stop_machines = "suspend"` snapshots the VM instead of stopping
#     it, so a miss resumes in well under a second rather than relaunching
#     Chromium. Suspend requires <= 2 GB memory and no swap; keep the VM
#     block below within that or Fly silently falls back to "stop".
#
# Rules: never set min_machines_running > 0 or auto_stop_machines = "off" here.
app = "contributor-info-social-cards"
primary_region = "sjc"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[experimental]
  auto_rollback = true

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  # One health check is enough; the old tcp + http pair kept the machine
  # "busy" from the proxy's point of view. grace_period covers Chromium startup.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[metrics]
  port = 9091
  path = "/metrics"

[deploy]
  strategy = "rolling"

# VM configuration for Playwright. 2048 MB is the suspend ceiling; do not
# add swap_size_mb, suspend does not support it.
[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
